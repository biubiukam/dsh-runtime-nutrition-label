name: Feature request
description: Propose a focused plugin capability
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operator or plugin-author problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Include the DSH event or service seam and a bounded MVP.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The proposal can avoid retaining raw arguments, results, files, credentials, and complete URLs.
          required: true
