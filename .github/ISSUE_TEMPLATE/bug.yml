name: Bug report
description: Report a reproducible defect
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, raw tool arguments, raw results, file contents, or complete URLs.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include sanitized configuration and the smallest relevant snapshot fragment.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks
      description: State the output of CI=1 pnpm check and the DSH runtime version.
    validations:
      required: true
